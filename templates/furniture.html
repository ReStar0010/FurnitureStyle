<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Furniture API Tester</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    form { margin-bottom: 2rem; }
    .item { display: flex; align-items: flex-start; margin: 1rem 0; }
    .item img { max-width: 120px; margin-right: 1rem; }
    .item .info { line-height: 1.4; }
    .hidden { display: none; }
    .fav-btn { 
      background-color: #f8f8f8; 
      border: 1px solid #ddd; 
      padding: 4px 8px; 
      cursor: pointer; 
      margin-top: 5px;
      border-radius: 4px;
    }
    .fav-btn:hover { background-color: #f0f0f0; }
    .fav-btn.added { 
      background-color: #ffecb3; 
      color: #ff8f00; 
      border-color: #ffcc80;
    }
    #favorites-section { margin-top: 2rem; }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Furniture API Tester</h1>

  <!-- IMAGE + COLOR SEARCH -->
  <section>
    <h2>1. Image + Color Search</h2>
    <form id="upload-form">
      <input type="file" name="image" accept="image/*" required />
      <label>Color:</label>
      <select name="color" id="color">
        <option value="original">原本</option>
        <option value="complementary">互補色</option>
        <option value="monochrome">單色</option>
        <option value="analogous">類似色</option>
      </select>
      <button type="submit">Search by Image</button>
    </form>

    <div id="image-result" class="hidden">
      <h3>Detected → Type: <span id="type-display"></span>  Style: <span id="style-display"></span></h3>
      <div id="shopping-display"></div>
    </div>
  </section>

  <hr/>

  <!-- TEXT SEARCH (unchanged) -->
  <section>
    <h2>2. Text Search</h2>
    <form id="text-form">
      <input type="text" name="query" placeholder="e.g. mid-century chair" required style="width:300px" />
      <label>Color:</label>
      <select name="color" id="color">
        <option value="original">原本</option>
        <option value="complementary">互補色</option>
        <option value="monochrome">單色</option>
        <option value="analogous">類似色</option>
      </select>
      <button type="submit">Search by Text</button>
    </form>
    <div id="text-result" class="hidden"<h3>Detected → Type: <span id="type-display-text"></span>  Style: <span id="style-display-text"></span></h3>>
      <h3>Text Results</h3>
      <div id="items-display"></div>
    </div>
  </section>

  <hr/>

  <!-- FAVORITES SECTION -->
  <section id="favorites-section">
    <h2>3. My Favorites</h2>
    <button id="load-favorites">Load My Favorites</button>
    <div id="favorites-display"></div>
  </section>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

<script>
  function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*'+name+'\\s*=\\s*([^;]+)');
    return match ? match.pop() : '';
  }

  // build headers for session‐protected endpoints
  function authHeaders(json=false) {
    const headers = {
      'X-CSRFToken': getCookie('csrftoken'),
    };
    if (json) {
      headers['Content-Type'] = 'application/json';
    }
    return headers;
  }

  // Toast notification function
  function showToast(message, duration = 3000) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    
    setTimeout(() => {
      toast.classList.remove('show');
    }, duration);
  }

  // Add to favorites function
  async function addToFavorites(item, furnitureType, furnitureStyle) {
    try {
      const res = await fetch('/api/furniture/favorites/', {
        method: 'POST',
        credentials: 'include',
        headers: {
          ...authHeaders(),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          title: item.title,
          link: item.link,
          price: item.price,
          image_url: item.imageUrl,
          position: item.position,
          furniture_type: furnitureType,
          furniture_style: furnitureStyle
        })
      });
      
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      
      if (res.status === 201) {
        showToast('Added to favorites!');
        return true;
      } else {
        showToast('Item already in favorites');
        return false;
      }
    } catch(err) {
      showToast('Failed to add to favorites: ' + err.message);
      console.error(err);
      return false;
    }
  }

  // Render furniture item
  function renderItem(item, container, furnitureType, furnitureStyle) {
    const div = document.createElement('div');
    div.classList.add('item');
    div.innerHTML = `
      <img src="${item.imageUrl}" alt="${item.title}" />
      <div class="info">
        <a href="${item.link}" target="_blank"><strong>${item.title}</strong></a><br/>
        Price: ${item.price}<br/>
        Delivery: ${item.delivery}<br/>
        Position: ${item.position}<br/>
        <button class="fav-btn">Add to Favorites</button>
      </div>`;
    
    // Add event listener to the favorite button
    const favBtn = div.querySelector('.fav-btn');
    favBtn.addEventListener('click', async () => {
      const success = await addToFavorites(item, furnitureType, furnitureStyle);
      if (success) {
        favBtn.textContent = 'Added to Favorites';
        favBtn.classList.add('added');
        favBtn.disabled = true;
      }
    });
    
    container.appendChild(div);
  }

  // — IMAGE + COLOR SEARCH —
  document.getElementById('upload-form').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    fd.append('color', document.getElementById('color').value);

    // reset
    document.getElementById('type-display').textContent = '';
    document.getElementById('style-display').textContent = '';
    const disp = document.getElementById('shopping-display');
    disp.innerHTML = '';
    document.getElementById('image-result').classList.add('hidden');

    try {
      // example fetch
  
      const res = await fetch('/api/furniture/image/', {
        method: 'POST',
        credentials: 'include',      // send sessionid cookie
        headers: authHeaders(),      // include CSRF token
        body: fd    // your FormData or JSON …
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      // show type & style
      document.getElementById('type-display').textContent  = data.type;
      document.getElementById('style-display').textContent = data.style;

      // render shopping array
      data.shopping.forEach(it => {
        renderItem(it, disp, data.type, data.style);
      });

      document.getElementById('image-result').classList.remove('hidden');
    } catch(err) {
      alert('Image search failed: ' + err.message);
      console.error(err);
    }
  };

  // — TEXT SEARCH (updated) —
  document.getElementById('text-form').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    fd.append('color', document.getElementById('color').value);

    // reset
    document.getElementById('type-display-text').textContent = '';
    document.getElementById('style-display-text').textContent = '';
    const disp = document.getElementById('items-display');
    disp.innerHTML = '';
    document.getElementById('text-result').classList.add('hidden');

    try {
      const res = await fetch('/api/furniture/text/', {
        method: 'POST',
        credentials: 'include',      // send sessionid cookie
        headers: authHeaders(),      // include CSRF token
        body: fd    // your FormData
      });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();

      // show type & style
      document.getElementById('type-display-text').textContent  = data.type;
      document.getElementById('style-display-text').textContent = data.style;

      // render shopping array with favorites buttons
      data.shopping.forEach(it => {
        renderItem(it, disp, data.type, data.style);
      });

      document.getElementById('text-result').classList.remove('hidden');
    } catch(err) {
      alert('Text search failed: ' + err.message);
      console.error(err);
    }
  };

  // — LOAD FAVORITES —
  document.getElementById('load-favorites').addEventListener('click', async () => {
    const favDisplay = document.getElementById('favorites-display');
    favDisplay.innerHTML = '<p>Loading favorites...</p>';
    
    try {
      const res = await fetch('/api/furniture/favorites/', {
        method: 'GET',
        credentials: 'include',
        headers: authHeaders()
      });
      
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      
      favDisplay.innerHTML = '';
      
      if (data.length === 0) {
        favDisplay.innerHTML = '<p>No favorites saved yet.</p>';
        return;
      }
      
      data.forEach(fav => {
        const div = document.createElement('div');
        div.classList.add('item');
        div.innerHTML = `
          <img src="${fav.image_url}" alt="${fav.title}" />
          <div class="info">
            <a href="${fav.link}" target="_blank"><strong>${fav.title}</strong></a><br/>
            Price: ${fav.price}<br/>
            Type: ${fav.furniture_type} / Style: ${fav.furniture_style}<br/>
            <button class="fav-btn remove-fav" data-id="${fav.id}">Remove from Favorites</button>
          </div>`;
        
        favDisplay.appendChild(div);
      });
      
      // Add event listeners to remove buttons
      document.querySelectorAll('.remove-fav').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.dataset.id;
          try {
            const res = await fetch(`/api/furniture/favorites/${id}/`, {
              method: 'DELETE',
              credentials: 'include',
              headers: authHeaders()
            });
            
            if (res.status === 204) {
              // Remove the item from the display
              e.target.closest('.item').remove();
              showToast('Removed from favorites');
              
              // Check if there are no items left
              if (favDisplay.children.length === 0) {
                favDisplay.innerHTML = '<p>No favorites saved yet.</p>';
              }
            } else {
              throw new Error(res.status);
            }
          } catch(err) {
            showToast('Failed to remove favorite: ' + err.message);
            console.error(err);
          }
        });
      });
      
    } catch(err) {
      favDisplay.innerHTML = '<p>Failed to load favorites</p>';
      console.error(err);
    }
  });
</script>
</body>
</html>
